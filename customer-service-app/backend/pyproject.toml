[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-agent-backend"
version = "0.1.0"
description = "Backend service for the ecommerce AI customer service platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "sqlalchemy[asyncio]>=2.0.52,<2.1",
    "asyncmy>=0.2.15,<0.3",
    "cryptography>=50.0.2,<51",
    "alembic>=1.20,<2",
    "openai",
    "pymilvus[milvus-lite]>=3.0,<3.1",
    "sentence-transformers>=6.1,<7",
]

[project.optional-dependencies]
dev = [
    "httpx2",
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "benchmarks*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: tests that require a running MySQL database",
]

[tool.ruff]
line-length = 100
target-version = "py312"
