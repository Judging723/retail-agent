[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-knowledge-pipeline"
version = "0.1.0"
description = "Offline knowledge ingestion and chunking pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
    "sentence-transformers>=6.1,<7",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["knowledge_pipeline*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["TRY004"]
