[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-agent-backend"
version = "0.1.0"
description = "Backend service for the ecommerce AI customer service platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
]

[project.optional-dependencies]
dev = [
    "httpx2",
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"