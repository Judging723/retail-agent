### Pinned base model
model_name_or_path: Qwen/Qwen3-4B-Instruct-2507
model_revision: f50518eb58dfc750271b273fc113bdfc16ec2280
trust_remote_code: true
quantization_bit: 4
quantization_method: bnb
quantization_type: nf4
double_quantization: true

### QLoRA method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 8
lora_target: all

### Clarification dataset
dataset: retail_agent_train
eval_dataset: retail_agent_dev
dataset_dir: data/processed/llamafactory
template: qwen3_nothink
default_system: 你是电商客服。当用户的购物需求信息不足时，先提出一个简洁、相关的澄清问题；不要编造商品、订单或平台政策。
cutoff_len: 1024
train_on_prompt: false
overwrite_cache: true
preprocessing_num_workers: 8
dataloader_num_workers: 4

### Output
output_dir: artifacts/qlora/qwen3-4b-instruct-2507
logging_steps: 10
save_strategy: steps
save_steps: 100
save_total_limit: 2
eval_strategy: steps
eval_steps: 100
load_best_model_at_end: true
metric_for_best_model: eval_loss
greater_is_better: false
plot_loss: true
overwrite_output_dir: true
report_to: none

### Single RTX 2080 Ti training
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
fp16: true
seed: 42
