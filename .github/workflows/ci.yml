name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      RETAIL_ENVIRONMENT: test
      RETAIL_DB_HOST: 127.0.0.1
      RETAIL_DB_PORT: 3306
      RETAIL_DB_NAME: retail_agent
      RETAIL_DB_USER: retail_app
      RETAIL_DB_PASSWORD: retail_ci_password
    services:
      mysql:
        image: mysql:8.4.11
        env:
          MYSQL_DATABASE: retail_agent
          MYSQL_USER: retail_app
          MYSQL_PASSWORD: retail_ci_password
          MYSQL_ROOT_PASSWORD: retail_ci_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pretail_ci_root_password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            customer-service-app/backend/pyproject.toml
            knowledge-pipeline/pyproject.toml
            model-pipeline/pyproject.toml
      - name: Install Python modules
        run: |
          python -m pip install -e "customer-service-app/backend[dev]"
          python -m pip install -e "knowledge-pipeline[dev]"
          python -m pip install -e "model-pipeline[dev]"
      - name: Lint
        run: make lint
      - name: Test
        run: |
          cd customer-service-app/backend
          alembic upgrade head
          cd ../..
          make test
          python model-serving/smoke_test.py --help

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: customer-service-app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: customer-service-app/frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
